<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3GPP RAG — Spec-grounded Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181c;
    --panel: #1c2227;
    --panel-raised: #232a30;
    --border: #2e363d;
    --text: #e8edf0;
    --text-muted: #8b98a3;
    --text-faint: #5a6570;
    --signal: #4fd1c5;
    --signal-dim: #2f6f69;
    --alert: #e8a33d;
    --alert-dim: #6b5027;
    --danger: #e2574c;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --radius: 8px;
  }
  *{ box-sizing: border-box; }
  html,body{ height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ── Top bar ─────────────────────────────────────────────────────── */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family: var(--mono);
    font-weight:600;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand .mark .dot{ color: var(--signal); }
  .brand .eyebrow{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .top-actions{ display:flex; gap:8px; }
  .btn{
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn:hover{ border-color: var(--signal-dim); color: var(--text); }
  .btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 1px; }

  /* ── Health strip ────────────────────────────────────────────────── */
  #health-strip{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    padding: 6px 20px;
    border-bottom: 1px solid var(--border);
    display:flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  #health-strip .flag{ color: var(--signal); }
  #health-strip .flag.off{ color: var(--text-faint); }

  /* ── Conversation ────────────────────────────────────────────────── */
  main{
    flex:1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    display:flex;
    justify-content:center;
  }
  .thread{ width: 100%; max-width: 720px; display:flex; flex-direction:column; gap: 18px; }

  .empty-state{
    margin-top: 12vh;
    text-align:center;
    color: var(--text-faint);
  }
  .empty-state .glyph{
    font-family: var(--mono);
    font-size: 34px;
    color: var(--signal-dim);
    margin-bottom: 10px;
  }
  .empty-state h2{ font-size: 15px; font-weight:500; color: var(--text-muted); margin: 0 0 6px; }
  .empty-state p{ font-size: 12.5px; margin:0; line-height:1.6; }
  .suggestions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top: 18px; }
  .suggestion{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 13px;
    cursor:pointer;
    background: var(--panel);
    transition: border-color .15s, color .15s;
  }
  .suggestion:hover{ border-color: var(--signal-dim); color: var(--text); }

  .msg{ display:flex; flex-direction:column; gap:6px; }
  .msg.user{ align-items:flex-end; }
  .msg.assistant{ align-items:flex-start; }

  .msg-label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 2px;
  }

  .bubble{
    max-width: 88%;
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.55;
  }
  .msg.user .bubble{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-top-right-radius: 2px;
  }
  .msg.assistant .bubble{
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
    width: 100%;
  }
  .msg.assistant .bubble.refused{
    background: transparent;
    border: 1px dashed var(--alert-dim);
  }
  .msg.assistant .bubble.error{
    border: 1px solid var(--danger);
  }

  .answer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8px;
    gap: 10px;
  }
  .answer-text{ color: var(--text); white-space: pre-wrap; }
  .refused-text{ color: var(--alert); display:flex; align-items:center; gap:8px; font-size: 13.5px; }
  .refused-text .ico{ font-family: var(--mono); }

  /* Signal-strength confidence meter — the signature element: the same
     visual language (a spectrum-analyzer bar) used across the product to
     represent evidence strength, tying directly to the composite score
     that decides whether an answer is trusted or refused. */
  .meter{
    display:flex;
    align-items:flex-end;
    gap: 2px;
    height: 14px;
    flex-shrink:0;
  }
  .meter .bar{
    width: 3.5px;
    background: var(--border);
    border-radius: 1px;
  }
  .meter .bar:nth-child(1){ height: 30%; }
  .meter .bar:nth-child(2){ height: 50%; }
  .meter .bar:nth-child(3){ height: 70%; }
  .meter .bar:nth-child(4){ height: 90%; }
  .meter .bar:nth-child(5){ height: 100%; }
  .meter.lit-1 .bar:nth-child(1){ background: var(--signal); }
  .meter.lit-2 .bar:nth-child(-n+2){ background: var(--signal); }
  .meter.lit-3 .bar:nth-child(-n+3){ background: var(--signal); }
  .meter.lit-4 .bar:nth-child(-n+4){ background: var(--signal); }
  .meter.lit-5 .bar:nth-child(-n+5){ background: var(--signal); }
  .confidence-label{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }

  .citations{ margin-top: 10px; display:flex; flex-direction:column; gap:6px; }
  .citation{
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow:hidden;
  }
  .citation summary{
    list-style:none;
    cursor:pointer;
    padding: 7px 10px;
    display:flex;
    align-items:center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--signal);
    background: rgba(79, 209, 197, 0.06);
  }
  .citation summary::-webkit-details-marker{ display:none; }
  .citation summary .caret{ color: var(--text-faint); transition: transform .15s; }
  .citation[open] summary .caret{ transform: rotate(90deg); }
  .citation .evidence{
    padding: 10px 12px 12px;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.55;
    border-top: 1px solid var(--border);
  }

  .meta-row{
    display:flex;
    gap: 12px;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
  }

  /* ── Thinking indicator ──────────────────────────────────────────── */
  .thinking{ display:flex; align-items:center; gap: 8px; padding: 4px 2px; }
  .thinking .scan{
    display:flex; gap: 3px;
  }
  .thinking .scan span{
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--signal-dim);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .thinking .scan span:nth-child(2){ animation-delay: .15s; }
  .thinking .scan span:nth-child(3){ animation-delay: .3s; }
  @keyframes pulse{
    0%, 80%, 100% { opacity: .25; transform: scale(0.85); background: var(--signal-dim); }
    40% { opacity: 1; transform: scale(1.05); background: var(--signal); }
  }
  .thinking .thinking-label{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  /* ── Composer ────────────────────────────────────────────────────── */
  footer{
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 14px 20px 18px;
    flex-shrink:0;
    display:flex;
    justify-content:center;
  }
  .composer{
    width:100%;
    max-width: 720px;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  #question{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    line-height: 1.4;
    max-height: 140px;
  }
  #question:focus-visible{ outline: 2px solid var(--signal); outline-offset: -1px; }
  #question::placeholder{ color: var(--text-faint); }
  #send{
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.03em;
    background: var(--signal-dim);
    color: #e8fdfb;
    border: none;
    border-radius: var(--radius);
    padding: 12px 18px;
    cursor:pointer;
    transition: background .15s;
    flex-shrink:0;
  }
  #send:hover:not(:disabled){ background: var(--signal); color: #0c1213; }
  #send:disabled{ opacity: .5; cursor:not-allowed; }
  #send:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 5px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">3GPP<span class="dot">·</span>RAG</span>
    <span class="eyebrow">spec-grounded Q&amp;A</span>
  </div>
  <div class="top-actions">
    <button class="btn" id="reset-btn" title="Clear conversation memory">Reset session</button>
  </div>
</header>

<div id="health-strip"></div>

<main>
  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">
      <div class="glyph">▂▄▆█</div>
      <h2>Ask a question about the loaded 3GPP specifications</h2>
      <p>Every answer is checked against retrieved spec text before it's shown.<br>No matching evidence → the bot tells you, instead of guessing.</p>
      <div class="suggestions">
        <span class="suggestion" data-q="What are the three RRC states a UE can be in?">RRC states</span>
        <span class="suggestion" data-q="What is the default value of timer T300?">Timer T300</span>
        <span class="suggestion" data-q="What key is K_SEAF derived from?">K_SEAF derivation</span>
        <span class="suggestion" data-q="What SST value corresponds to URLLC?">URLLC slice type</span>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="question" rows="1" placeholder="Ask about a 3GPP procedure, timer, or information element…"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
(function(){
  const API = "/api";
  let sessionId = null;

  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const questionEl = document.getElementById('question');
  const sendBtn = document.getElementById('send');
  const resetBtn = document.getElementById('reset-btn');
  const healthStrip = document.getElementById('health-strip');

  function scrollToBottom(){
    window.scrollTo(0, document.body.scrollHeight);
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function confidenceToLitLevel(score){
    // score in [0,1] roughly -> 1..5 lit bars
    if (score >= 0.85) return 5;
    if (score >= 0.7) return 4;
    if (score >= 0.55) return 3;
    if (score >= 0.35) return 2;
    return 1;
  }

  function renderMeter(score){
    const wrap = el('div', 'meter lit-' + confidenceToLitLevel(score));
    for (let i=0;i<5;i++) wrap.appendChild(el('div','bar'));
    return wrap;
  }

  function addUserMessage(text){
    emptyState.style.display = 'none';
    const msg = el('div','msg user');
    msg.appendChild(el('div','msg-label','You'));
    const bubble = el('div','bubble');
    bubble.textContent = text;
    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
  }

  function addThinking(){
    const msg = el('div','msg assistant');
    msg.id = 'thinking-msg';
    const bubble = el('div','bubble');
    const t = el('div','thinking');
    const scan = el('div','scan');
    scan.appendChild(el('span')); scan.appendChild(el('span')); scan.appendChild(el('span'));
    t.appendChild(scan);
    t.appendChild(el('div','thinking-label','searching specifications…'));
    bubble.appendChild(t);
    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
  }

  function removeThinking(){
    const n = document.getElementById('thinking-msg');
    if (n) n.remove();
  }

  function addAssistantMessage(data){
    const msg = el('div','msg assistant');
    msg.appendChild(el('div','msg-label','Assistant'));
    const bubble = el('div', 'bubble' + (data.refused ? ' refused' : ''));

    if (data.refused){
      const head = el('div','refused-text');
      head.appendChild(el('span','ico','⚠'));
      head.appendChild(el('span', null, data.answer));
      bubble.appendChild(head);
    } else {
      const head = el('div','answer-head');
      head.appendChild(el('div','answer-text', data.answer));
      const meterWrap = document.createElement('div');
      meterWrap.style.display = 'flex';
      meterWrap.style.flexDirection = 'column';
      meterWrap.style.alignItems = 'flex-end';
      meterWrap.style.gap = '3px';
      meterWrap.appendChild(renderMeter(data.overall_confidence));
      meterWrap.appendChild(el('div','confidence-label', data.overall_confidence.toFixed(2)));
      head.appendChild(meterWrap);
      bubble.appendChild(head);

      if (data.citations && data.citations.length){
        const citWrap = el('div','citations');
        data.citations.forEach(c => {
          const details = document.createElement('details');
          details.className = 'citation';
          const summary = document.createElement('summary');
          summary.appendChild(el('span','caret','▸'));
          summary.appendChild(document.createTextNode(c.citation || 'source'));
          details.appendChild(summary);
          const ev = el('div','evidence', c.evidence_snippet || '(no evidence text returned)');
          details.appendChild(ev);
          citWrap.appendChild(details);
        });
        bubble.appendChild(citWrap);
      }
    }

    const meta = el('div','meta-row');
    meta.appendChild(el('span', null, 'latency ' + data.latency_seconds.toFixed(2) + 's'));
    meta.appendChild(el('span', null, 'coverage ' + Math.round(data.coverage_ratio*100) + '%'));
    bubble.appendChild(meta);

    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
  }

  function addErrorMessage(text){
    const msg = el('div','msg assistant');
    msg.appendChild(el('div','msg-label','Assistant'));
    const bubble = el('div','bubble error');
    bubble.textContent = text;
    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
  }

  async function sendQuestion(text){
    if (!text.trim()) return;
    addUserMessage(text);
    questionEl.value = '';
    questionEl.style.height = 'auto';
    sendBtn.disabled = true;
    addThinking();

    try {
      const resp = await fetch(API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, session_id: sessionId })
      });
      removeThinking();
      if (!resp.ok){
        const errBody = await resp.json().catch(() => ({}));
        addErrorMessage(errBody.detail || ('Request failed with status ' + resp.status));
        return;
      }
      const data = await resp.json();
      sessionId = data.session_id;
      addAssistantMessage(data);
    } catch (err){
      removeThinking();
      addErrorMessage('Could not reach the backend: ' + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => sendQuestion(questionEl.value));
  questionEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendQuestion(questionEl.value);
    }
  });
  questionEl.addEventListener('input', () => {
    questionEl.style.height = 'auto';
    questionEl.style.height = Math.min(questionEl.scrollHeight, 140) + 'px';
  });

  document.querySelectorAll('.suggestion').forEach(s => {
    s.addEventListener('click', () => sendQuestion(s.getAttribute('data-q')));
  });

  resetBtn.addEventListener('click', async () => {
    if (sessionId){
      try { await fetch(API + '/sessions/' + sessionId + '/reset', { method: 'POST' }); } catch(e){}
    }
    sessionId = null;
    thread.innerHTML = '';
    thread.appendChild(emptyState);
    emptyState.style.display = '';
  });

  async function loadHealth(){
    try {
      const resp = await fetch(API + '/health');
      const h = await resp.json();
      healthStrip.innerHTML = '';
      const parts = [
        ['index: ' + h.index_vectors + ' chunks', true],
        ['reranker ' + (h.reranker_enabled ? 'on' : 'off'), h.reranker_enabled],
        ['nli verifier ' + (h.nli_verifier_enabled ? 'on' : 'off'), h.nli_verifier_enabled],
        ['groq ' + (h.groq_configured ? 'configured' : 'not configured'), h.groq_configured],
      ];
      parts.forEach(([label, on]) => {
        healthStrip.appendChild(el('span', 'flag' + (on ? '' : ' off'), label));
      });
    } catch(e){
      healthStrip.textContent = 'backend unreachable';
    }
  }
  loadHealth();
})();
</script>
</body>
</html>
